<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bits</title>
<meta name="description" content="Calorías por comida, gym y entrenamiento funcional, y análisis de tu avance hacia tu meta de peso.">
<meta name="theme-color" content="#F2F5FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F141C" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bits">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Layout: una sola columna tipo app de iPhone, tarjetas por tarea, barra de pestañas fija abajo */
:root {
  --bg: #F2F5FA;
  --surface: #FFFFFF;
  --ink: #141C28;
  --muted: #5C6778;
  --line: #DCE2EC;
  --accent: #1F5FD6;       /* azul Bits: comida y acciones */
  --accent-soft: #E3ECFB;
  --act: #A86F00;          /* mostaza: actividad */
  --act-soft: #FBF0D9;
  --good: #2E7D50;
  --good-soft: #E1F1E7;
  --warn: #C2362B;
  --warn-soft: #FBE3E0;
  --water: #0E9BC4;        /* agua */
  --water-soft: #DDF2F9;
  --font-display: ui-rounded, "SF Pro Rounded", -apple-system, system-ui, "Segoe UI", sans-serif;
  --font-body: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --radius: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0F141C; --surface: #18202B; --ink: #E7ECF3; --muted: #97A3B4; --line: #27313F;
    --accent: #6EA0FF; --accent-soft: #18243D; --act: #E8B24A; --act-soft: #352A14;
    --good: #5CC28A; --good-soft: #17301F; --warn: #F27A6E; --warn-soft: #3A1B18;
    --water: #4CC9E8; --water-soft: #12303A;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.45 var(--font-body);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
main {
  max-width: 560px;
  margin: 0 auto;
  padding-top: calc(env(safe-area-inset-top, 0px) + 12px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px;
}
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h1 { font-size: 1.75rem; letter-spacing: -0.01em; }
h2 { font-size: 1.1rem; }
h3 { font-size: 0.95rem; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }

.card { background: var(--surface); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 12px; }

/* Encabezado con navegación de fecha */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.topbar .title { min-width: 0; }
.topbar .title p::first-letter { text-transform: uppercase; }
.iconbtn {
  width: 40px; height: 40px; border-radius: 50%; border: 0; flex: none;
  background: var(--surface); color: var(--ink); font-size: 1.2rem; cursor: pointer;
}
.iconbtn:disabled { opacity: 0.35; }
.navrow { display: flex; gap: 8px; }

/* Resumen del día */
.summary .big { font-family: var(--font-display); font-size: 2.6rem; font-weight: 700; line-height: 1; }
.summary .big small { font-size: 1rem; font-weight: 600; color: var(--muted); margin-left: 4px; }
.bar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; display: flex; }
.bar span { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.bar.over span { background: var(--warn); }
.bar.goal span { background: var(--good); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; font-size: 0.85rem; font-weight: 600; align-self: flex-start; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.info { background: var(--accent-soft); color: var(--accent); }

/* Formularios */
form { display: flex; flex-direction: column; gap: 10px; margin: 0; }
label { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; color: var(--muted); font-weight: 600; }
input, select {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; width: 100%; min-width: 0;
  -webkit-appearance: none; appearance: none;
}
input[type="date"] { min-height: 46px; }
select { background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
input:focus-visible, select:focus-visible, button:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 1px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.row.r3 > :first-child { grid-column: 1 / -1; }
.hint { font-weight: 400; font-size: 0.78rem; }

.btn {
  font: inherit; font-weight: 700; border: 0; border-radius: 12px; padding: 12px 16px; cursor: pointer;
  background: var(--accent); color: #fff;
}
.btn.act { background: var(--act); color: #fff; }
.btn.ghost { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: var(--warn); color: #fff; }
.btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
.btnrow .btn { flex: 1 1 140px; }
.inline { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end; }

.seg { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--bg); border-radius: 12px; padding: 3px; gap: 3px; }
.seg.i3 { grid-template-columns: repeat(3, 1fr); }
.seg button { font: inherit; font-size: 0.85rem; font-weight: 600; border: 0; border-radius: 9px; padding: 8px 2px; background: transparent; color: var(--muted); cursor: pointer; }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--accent); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.seg.i3 button[aria-checked="true"] { color: var(--act); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips button { font: inherit; font-size: 0.88rem; font-weight: 600; border: 1px solid var(--line); border-radius: 99px; padding: 8px 14px; background: var(--bg); color: var(--ink); cursor: pointer; }
.chips button[aria-checked="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

/* Listas de registros */
.group { display: flex; flex-direction: column; gap: 4px; }
.group-head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
.item { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.item .name { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.item .kcal { font-variant-numeric: tabular-nums; font-weight: 600; }
.del { border: 0; background: transparent; color: var(--muted); font-size: 1.1rem; width: 32px; height: 32px; border-radius: 50%; cursor: pointer; flex: none; }
.del:hover { background: var(--bg); }
.empty { padding: 8px 0; }

/* Semana */
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 10px; font-family: var(--font-body); }
.chart text.today { fill: var(--ink); font-weight: 700; }
.kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi { background: var(--surface); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.card .kpi { background: var(--bg); }
.kpi b { font-family: var(--font-display); font-size: 1.35rem; font-variant-numeric: tabular-nums; }
.days { display: flex; flex-direction: column; }
.day { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; padding: 10px 0; border: 0; border-top: 1px solid var(--line); background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.day:first-child { border-top: 0; }
.day .d { text-transform: capitalize; }
.day .v { font-variant-numeric: tabular-nums; text-align: right; }
.meter { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--act); }

/* Agua y pasos */
.habit { display: flex; flex-direction: column; gap: 8px; }
.habit + .habit { border-top: 1px solid var(--line); padding-top: 12px; }
.habit-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.habit-head b { font-family: var(--font-display); font-size: 1.3rem; font-variant-numeric: tabular-nums; }
.bottles { display: flex; flex-wrap: wrap; gap: 6px; }
.bottles svg { width: 26px; height: 42px; }
.btn.water { background: var(--water-soft); color: var(--water); }
.water-btns { display: grid; grid-template-columns: auto 1fr 1fr; gap: 8px; }
.water-btns .btn { padding-inline: 12px; }
.bar.steps span { background: var(--accent); }

/* Progreso de peso */
.scale { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.scale b { display: block; font-family: var(--font-display); font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.scale .now b { color: var(--accent); }

/* Análisis */
.tip { border-radius: var(--radius); padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; background: var(--surface); border-left: 4px solid var(--line); }
.tip.good { border-left-color: var(--good); }
.tip.warn { border-left-color: var(--warn); }
.tip.info { border-left-color: var(--accent); }
.tip.act { border-left-color: var(--act); }
.section-label { margin-top: 6px; }

/* Barra de pestañas */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}
nav.tabs .inner { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
nav.tabs button { font: inherit; font-size: 0.72rem; font-weight: 600; border: 0; background: none; color: var(--muted); padding: 8px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button[aria-current="page"] { color: var(--accent); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 76px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: 0.9rem; font-weight: 600; z-index: 10; max-width: calc(100% - 32px); text-align: center; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<main id="view"></main>

<nav class="tabs" aria-label="Secciones">
  <div class="inner">
    <button data-tab="hoy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3 2"/></svg>Hoy</button>
    <button data-tab="semana"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V12M10 20V6M15 20v-9M20 20V9"/></svg>Semana</button>
    <button data-tab="analisis"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-5 4 3 8-8"/><path d="M15 7h5v5"/></svg>Análisis</button>
    <button data-tab="perfil"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Perfil</button>
  </div>
</nav>

<datalist id="foods"></datalist>
<datalist id="groups"></datalist>
<div id="toast" class="toast" hidden></div>

<script>
const KEY = 'bits.v1';
const OLD_KEY = 'platoypaso.v1';
const KCAL_PER_KG = 7700;
const MEALS = [['desayuno', 'Desayuno'], ['comida', 'Comida'], ['cena', 'Cena'], ['snack', 'Snack']];
const OBJ = {
  grasa: { label: 'Bajar grasa', prot: 1.8 },
  musculo: { label: 'Ganar músculo', prot: 2.0 },
  recomp: { label: 'Recomposición', prot: 2.0 },
  rendimiento: { label: 'Rendimiento', prot: 1.6 },
  mantener: { label: 'Mantenerme', prot: 1.4 }
};
// Valores MET del Compendium of Physical Activities (aprox.), agrupados como aparecen en la lista
const ACT_GROUPS = [
  ['Gym', { pesas: ['Pesas y máquinas', 5], spinning: ['Spinning', 8.5], caminadora: ['Caminadora inclinada', 6], eliptica: ['Elíptica', 5], escaladora: ['Escaladora', 9], remo: ['Remo', 7] }],
  ['Entrenamiento funcional', { funcional: ['Funcional', 7], crossfit: ['CrossFit / WOD', 8], hiit: ['HIIT / circuito', 8], calistenia: ['Calistenia', 6], trx: ['TRX', 5], kettlebell: ['Kettlebells', 8], box: ['Box / kickboxing', 7.8] }],
  ['Cardio y deportes', { caminar: ['Caminar', 3.5], correr: ['Correr', 9.8], bici: ['Bicicleta', 7.5], nadar: ['Natación', 6], futbol: ['Fútbol', 7], baile: ['Baile', 5] }],
  ['Movilidad', { yoga: ['Yoga', 2.5], pilates: ['Pilates', 3], estiramiento: ['Estiramiento', 2.3], otro: ['Otra', 4] }]
];
const ACTS = Object.assign({}, ...ACT_GROUPS.map(g => g[1]));
const STRENGTH = ['pesas', 'funcional', 'crossfit', 'calistenia', 'trx', 'kettlebell'];
const INTENS = [['ligera', 'Ligera', 0.8], ['moderada', 'Moderada', 1], ['intensa', 'Intensa', 1.2]];
const MUSCLES = ['Pierna', 'Glúteo', 'Espalda', 'Pecho', 'Hombro', 'Brazos', 'Core'];
const GROUPS = [...MUSCLES, 'Full body', 'Torso', 'Tren inferior'];
// Porciones comunes con calorías aproximadas
const FOODS = [
  ['Huevo (1 pieza)', 78], ['Claras de huevo (3)', 51], ['Tortilla de maíz (1)', 52], ['Pan integral (1 rebanada)', 70], ['Bolillo (1)', 230],
  ['Manzana (1 mediana)', 95], ['Plátano (1)', 105], ['Papaya (1 taza)', 60], ['Arroz cocido (1 taza)', 205],
  ['Frijoles cocidos (1 taza)', 225], ['Pechuga de pollo (100 g)', 165], ['Carne de res (100 g)', 250],
  ['Atún en agua (1 lata)', 120], ['Proteína whey (1 scoop)', 120], ['Aguacate (1/2)', 120], ['Leche entera (1 taza)', 150], ['Leche descremada (1 taza)', 85],
  ['Yogur griego natural (1 taza)', 130], ['Avena cruda (1/2 taza)', 150], ['Queso panela (30 g)', 75], ['Café con leche (1 taza)', 70],
  ['Crema de cacahuate (1 cda)', 95], ['Refresco (lata 355 ml)', 140], ['Jugo de naranja (1 vaso)', 110], ['Cerveza (355 ml)', 150], ['Pasta cocida (1 taza)', 220],
  ['Ensalada verde (1 taza)', 20], ['Almendras (30 g)', 170], ['Taco al pastor (1)', 150], ['Quesadilla (1)', 230],
  ['Barra de proteína (1)', 200], ['Galletas (3 piezas)', 160], ['Chocolate (30 g)', 160], ['Pizza (1 rebanada)', 285]
];

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => Math.round(n).toLocaleString('es-MX');
const kg = n => (+n).toLocaleString('es-MX', { maximumFractionDigits: 1 });
const signed = (n, f = fmt) => (n > 0 ? '+' : n < 0 ? '−' : '') + f(Math.abs(n));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

// Fechas en formato local AAAA-MM-DD
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const today = () => iso(new Date());
const weekStart = s => { const d = parse(s); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return iso(d); };
const longDay = s => parse(s).toLocaleDateString('es-MX', { weekday: 'long', day: 'numeric', month: 'long' });
const shortDay = s => parse(s).toLocaleDateString('es-MX', { weekday: 'short', day: 'numeric' });
const fullDate = s => parse(s).toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' });

function load() {
  for (const k of [KEY, OLD_KEY]) {
    try {
      const d = JSON.parse(localStorage.getItem(k));
      if (d && Array.isArray(d.entries) && Array.isArray(d.acts)) return migrate(d);
    } catch (e) {}
  }
  return { profile: null, entries: [], acts: [], weights: [], daily: {} };
}
// Datos de la versión anterior (Plato y Paso): metas perder/mantener/ganar sin peso meta
function migrate(d) {
  d.weights = Array.isArray(d.weights) ? d.weights : [];
  d.daily = d.daily && typeof d.daily === 'object' ? d.daily : {};
  const p = d.profile;
  if (p && p.meta) {
    p.objetivo = { perder: 'grasa', ganar: 'musculo', mantener: 'mantener' }[p.meta] || 'mantener';
    delete p.meta;
  }
  return d;
}
const S = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('No se pudo guardar. Revisa el espacio de tu iPhone.'); }
}

function defaultMeal() {
  const h = new Date().getHours();
  return h < 12 ? 'desayuno' : h < 17 ? 'comida' : 'cena';
}
const state = {
  tab: S.profile && S.profile.pesoMeta ? 'hoy' : 'perfil', date: today(), week: 0,
  meal: defaultMeal(), intens: 'moderada', confirmWipe: false
};

function sortedWeights() { return [...S.weights].sort((a, b) => a.date.localeCompare(b.date)); }
function currentWeight() {
  const w = sortedWeights();
  return w.length ? w[w.length - 1].kg : S.profile ? S.profile.peso : 70;
}
function setWeight(date, value) {
  S.weights = S.weights.filter(w => w.date !== date);
  S.weights.push({ id: uid(), date, kg: value });
}

// Plan a partir de la meta de la usuaria: Mifflin-St Jeor para el gasto, 7,700 kcal por kg para el ritmo
function calc(p) {
  if (!p || !p.pesoMeta || !p.fechaMeta) return null;
  const peso = currentWeight();
  const bmr = 10 * peso + 6.25 * p.altura - 5 * p.edad + (p.sexo === 'h' ? 5 : -161);
  const tdee = bmr * p.factor;
  const days = daysBetween(today(), p.fechaMeta);
  const diff = p.pesoMeta - peso;
  const dailyAdj = days > 0 ? diff * KCAL_PER_KG / days : 0;
  const auto = Math.max(0, Math.round((tdee + dailyAdj) / 10) * 10);
  return {
    peso, bmr: Math.round(bmr), tdee: Math.round(tdee), days, diff,
    dailyAdj: Math.round(dailyAdj), weekly: days > 0 ? diff / days * 7 : 0,
    auto, target: p.kcalManual > 0 ? p.kcalManual : auto, manual: p.kcalManual > 0,
    prot: Math.round(peso * OBJ[p.objetivo].prot)
  };
}

function dayTotals(date) {
  const foods = S.entries.filter(e => e.date === date);
  const acts = S.acts.filter(a => a.date === date);
  const byMeal = {};
  MEALS.forEach(([k]) => byMeal[k] = foods.filter(f => f.meal === k).reduce((s, f) => s + f.kcal, 0));
  return {
    foods, acts, byMeal,
    eaten: foods.reduce((s, f) => s + f.kcal, 0),
    burned: acts.reduce((s, a) => s + a.kcal, 0),
    minutes: acts.reduce((s, a) => s + a.min, 0),
    strength: acts.filter(a => STRENGTH.includes(a.type)).length
  };
}

// Agua (en botellas Owala de 32 oz) y pasos, uno por día
const OWALA_ML = 946;
const day = date => S.daily[date] || { water: 0, steps: 0 };
function setDay(date, patch) { S.daily[date] = { ...day(date), ...patch }; }
function waterGoal() {
  const p = S.profile;
  if (p && p.aguaMeta > 0) return p.aguaMeta;
  return Math.max(1, Math.round(currentWeight() * 35 / OWALA_ML * 2) / 2);
}
const stepsGoal = () => (S.profile && S.profile.pasosMeta > 0 ? S.profile.pasosMeta : 10000);
const bottlesText = n => kg(n) + (n === 1 ? ' Owala' : ' Owalas');

function bottlesSvg(filled, goal) {
  const count = Math.max(Math.ceil(goal), Math.ceil(filled));
  return Array.from({ length: count }, (_, i) => {
    const level = Math.max(0, Math.min(1, filled - i));
    const top = 12 + 28 * (1 - level);
    return `<svg viewBox="0 0 26 42" aria-hidden="true">
      <defs><clipPath id="bt${i}"><rect x="3" y="10" width="20" height="30" rx="6"/></clipPath></defs>
      <rect x="8" y="2" width="10" height="7" rx="2" fill="var(--water)"/>
      <rect x="3" y="10" width="20" height="30" rx="6" fill="var(--water-soft)" stroke="var(--water)" stroke-width="1.5"/>
      ${level > 0 ? `<rect x="3" y="${top}" width="20" height="${40 - top}" fill="var(--water)" clip-path="url(#bt${i})"/>` : ''}
    </svg>`;
  }).join('');
}

function actKcal(type, min, intens) {
  const f = (INTENS.find(i => i[0] === intens) || INTENS[1])[2];
  return Math.round(ACTS[type][1] * f * currentWeight() * min / 60);
}

let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer);

}

/* ---------- SEMANA ---------- */
function weekChart(days, target) {
  const W = 340, H = 190, L = 36, R = 6, T = 12, B = 26;
  const maxData = Math.max(target || 0, ...days.map(x => x.eaten), 500);
  const step = maxData > 3000 ? 1000 : 500;
  const maxV = Math.ceil((maxData * 1.1) / step) * step;
  const y = v => T + (H - T - B) * (1 - v / maxV);
  const slot = (W - L - R) / 7, bw = slot * 0.56;
  let g = '';
  for (let v = 0; v <= maxV; v += step) {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`;
    g += `<text x="${L - 6}" y="${y(v) + 3.5}" text-anchor="end">${v >= 1000 ? (v / 1000) + 'k' : v}</text>`;
  }
  const letters = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
  days.forEach((d, i) => {
    const x = L + slot * i + (slot - bw) / 2;
    const budget = target ? target + d.burned : null;
    if (d.eaten > 0) {
      const color = budget && d.eaten > budget ? 'var(--warn)' : 'var(--accent)';
      g += `<rect x="${x}" y="${y(d.eaten)}" width="${bw}" height="${y(0) - y(d.eaten)}" rx="4" fill="${color}"/>`;
    }
    if (d.burned > 0) {
      g += `<rect x="${x + bw / 2 - 2}" y="${y(0) + 3}" width="4" height="4" rx="2" fill="var(--act)"/>`;
    }
    g += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle" class="${d.date === today() ? 'today' : ''}">${letters[i]}</text>`;
  });
  if (target) {
    g += `<line x1="${L}" x2="${W - R}" y1="${y(target)}" y2="${y(target)}" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
    g += `<text x="${W - R}" y="${y(target) - 4}" text-anchor="end" class="today">meta ${fmt(target)}</text>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calorías por día de la semana">${g}</svg>`;
}

    </header>

      <h2>Calorías por día</h2>
      ${weekChart(days, c && c.target)}
      <p class="muted small"><span class="dot" style="background:var(--accent)"></span>Dentro de meta
        <span class="dot" style="background:var(--warn);margin-left:10px"></span>Arriba de meta
        <span class="dot" style="background:var(--act);margin-left:10px"></span>Entrenaste</p>
    </section>
    <section class="kpis">
      <div class="kpi"><span class="eyebrow">Promedio diario</span><b>${logged.length ? fmt(avg) : '—'}</b><span class="muted small">${logged.length} de 7 días registrados</span></div>
      <div class="kpi"><span class="eyebrow">Días en meta</span><b>${c ? inGoal + ' / ' + logged.length : '—'}</b><span class="muted small">${c ? 'meta ' + fmt(c.target) + ' kcal' : 'pon tu meta en Perfil'}</span></div>
      <div class="kpi"><span class="eyebrow">Gym y funcional</span><b>${strength}</b><span class="muted small">sesiones de fuerza</span></div>
      <div class="kpi"><span class="eyebrow">Minutos activos</span><b>${fmt(mins)}</b>
        <div class="meter" aria-label="${mins} de 150 minutos"><span style="width:${Math.min(100, mins / 150 * 100)}%"></span></div>
        <span class="muted small">${fmt(burned)} kcal quemadas</span></div>
      <div class="kpi"><span class="eyebrow">Agua promedio</span><b style="color:var(--water)">${waterDays.length ? kg(Math.round(avgWater * 10) / 10) : '—'}</b><span class="muted small">Owalas al día · meta ${kg(waterGoal())}</span></div>
      <div class="kpi"><span class="eyebrow">Pasos promedio</span><b>${stepDays.length ? fmt(avgSteps) : '—'}</b><span class="muted small">al día · meta ${fmt(stepsGoal())}</span></div>
      <div class="kpi"><span class="eyebrow">Cambio de peso</span><b>${wChange === null ? '—' : signed(wChange, kg) + ' kg'}</b><span class="muted small">${wk.length} ${wk.length === 1 ? 'pesaje' : 'pesajes'} esta semana</span></div>
      <div class="kpi"><span class="eyebrow">Peso actual</span><b>${S.profile ? kg(currentWeight()) + ' kg' : '—'}</b><span class="muted small">${S.profile && S.profile.pesoMeta ? 'meta ' + kg(S.profile.pesoMeta) + ' kg' : ''}</span></div>
    </section>
    <section class="card">
      <h2>Día por día</h2>

          <button class="day" data-action="open-day" data-date="${d.date}">

          </button>`).join('')}

}

/* ---------- ANÁLISIS ---------- */
function progressInfo(p, c) {
  const start = p.pesoInicio || p.peso, cur = c.peso, goal = p.pesoMeta;
  const total = goal - start, done = cur - start, remaining = goal - cur;
  const pct = Math.abs(total) < 0.05 ? (Math.abs(remaining) < 0.05 ? 100 : 0) : Math.max(0, Math.min(100, done / total * 100));
  const w = sortedWeights();
  let rate = null, eta = null;
  if (w.length >= 2) {
    const span = daysBetween(w[0].date, w[w.length - 1].date);
    if (span >= 7) {
      rate = (w[w.length - 1].kg - w[0].kg) / span * 7;
      if (rate !== 0 && Math.sign(rate) === Math.sign(remaining)) eta = addDays(today(), Math.round(remaining / rate * 7));
    }
  }
  return { start, cur, goal, remaining, pct, rate, eta, reached: Math.abs(remaining) < 0.1 };
}

function buildAnalysis(p, c) {
  const tips = [];
  const last7 = Array.from({ length: 7 }, (_, i) => { const date = addDays(today(), -i); return { date, ...dayTotals(date) }; });
  const logged = last7.filter(d => d.eaten > 0);
  const burned7 = last7.reduce((s, d) => s + d.burned, 0);
  const mins7 = last7.reduce((s, d) => s + d.minutes, 0);
  const strength7 = last7.reduce((s, d) => s + d.strength, 0);

  // Calorías vs plan
  if (!logged.length) {
    tips.push({ tone: 'info', title: 'Registra tus comidas', body: 'Con 3 o más días registrados calculo a qué ritmo vas realmente hacia tu meta.' });
  } else {
    const avg = logged.reduce((s, d) => s + d.eaten, 0) / logged.length;
    const avgBurn = logged.reduce((s, d) => s + d.burned, 0) / logged.length;
    const balance = avg - (c.tdee + avgBurn);
    const estWeekly = balance * 7 / KCAL_PER_KG;
    const gap = Math.round(c.target - avg);
    const onPlan = Math.abs(gap) <= 150;
    tips.push({
      tone: onPlan ? 'good' : 'info',
      title: onPlan ? 'Vas al ritmo de tu plan' : `${gap > 0 ? 'Agrega' : 'Recorta'} unas ${fmt(Math.abs(gap))} kcal al día`,
      body: `Tu promedio es ${fmt(avg)} kcal y tu meta ${fmt(c.target)}. Con lo que comes y entrenas, el ritmo estimado es ${signed(estWeekly, kg)} kg por semana; tu plan pide ${signed(c.weekly, kg)} kg.`
    });

    const tot = logged.reduce((acc, d) => { MEALS.forEach(([k]) => acc[k] = (acc[k] || 0) + d.byMeal[k]); acc.all = (acc.all || 0) + d.eaten; return acc; }, {});
    if (tot.cena / tot.all > 0.4) {
      tips.push({ tone: 'info', title: 'La cena es tu comida más grande', body: `El ${Math.round(tot.cena / tot.all * 100)}% de tus calorías llegan en la cena. Si quieres más energía para entrenar, mueve parte a la comida o a tu pre-entreno.` });
    }
    const drinks = S.entries.filter(e => logged.some(d => d.date === e.date) && /refresco|jugo|cerveza|soda|coca|frappe|malteada/i.test(e.name));
    if (drinks.length) {
      const k = drinks.reduce((s, e) => s + e.kcal, 0);
      tips.push({ tone: 'info', title: `${fmt(k)} kcal en bebidas esta semana`, body: 'Si necesitas hacer espacio en tus calorías, las bebidas suelen ser lo más fácil de cambiar.' });
    }
  }

  // Entrenamiento según el objetivo
  const o = p.objetivo;
  if (o === 'musculo' || o === 'recomp') {
    const worked = new Set();
    last7.forEach(d => d.acts.forEach(a => {
      if (!STRENGTH.includes(a.type) || !a.detalle) return;
      const t = a.detalle.toLowerCase();
      if (t.includes('full')) MUSCLES.forEach(m => worked.add(m));
      if (t.includes('torso')) ['Espalda', 'Pecho', 'Hombro', 'Brazos'].forEach(m => worked.add(m));
      if (t.includes('inferior')) ['Pierna', 'Glúteo'].forEach(m => worked.add(m));
      MUSCLES.forEach(m => { if (t.includes(m.toLowerCase())) worked.add(m); });
    }));
    const missing = MUSCLES.filter(m => !worked.has(m));
    tips.push({
      tone: strength7 >= 3 ? 'good' : 'act',
      title: `${strength7} ${strength7 === 1 ? 'sesión' : 'sesiones'} de fuerza en 7 días`,
      body: `Para ${o === 'musculo' ? 'ganar músculo' : 'recomposición'} funciona entrenar cada grupo 2 veces por semana, de 3 a 5 sesiones.` +
        (worked.size && missing.length ? ` Esta semana no has trabajado: ${missing.join(', ')}.` : worked.size ? ' Ya trabajaste todos los grupos principales.' : ' Anota qué trabajaste en cada sesión y te digo qué grupos faltan.')
    });
  } else if (o === 'grasa') {
    tips.push({
      tone: 'act', title: `Quemaste ${fmt(burned7)} kcal entrenando`,
      body: `Eso equivale a ${kg(burned7 / KCAL_PER_KG)} kg de grasa en la semana. Llevas ${strength7} ${strength7 === 1 ? 'sesión' : 'sesiones'} de fuerza: mantener las pesas mientras bajas ayuda a que lo que pierdas sea grasa.`
    });
  } else if (o === 'rendimiento') {
    const types = new Set(last7.flatMap(d => d.acts.map(a => a.type)));
    tips.push({ tone: 'act', title: `${fmt(mins7)} minutos y ${types.size} tipos de entrenamiento`, body: 'Para rendimiento combina fuerza, funcional o intervalos y una sesión larga a ritmo cómodo cada semana.' });
  } else {
    tips.push({ tone: mins7 >= 150 ? 'good' : 'act', title: `${fmt(mins7)} minutos activos en 7 días`, body: 'Con 150 minutos a la semana y 2 días de fuerza mantienes tu condición y tu músculo.' });
  }

  const routines = {
    grasa: '3 días de pesas de cuerpo completo + 2 días de funcional o HIIT de 20 a 30 min. Camina en los días libres.',
    musculo: '4 días: torso, pierna, torso, pierna. De 3 a 4 series de 6 a 12 repeticiones por ejercicio, subiendo peso poco a poco.',
    recomp: '3 a 4 días de pesas (cuerpo completo o torso/pierna) + 1 o 2 sesiones de funcional. La fuerza va primero.',
    rendimiento: '2 días de fuerza, 2 de funcional o intervalos y 1 de cardio largo a ritmo cómodo.',
    mantener: '2 o 3 días de fuerza y el resto de tu actividad favorita hasta sumar 150 minutos.'
  };
  tips.push({ tone: 'act', title: 'Rutina sugerida para ' + OBJ[o].label.toLowerCase(), body: routines[o] });
  tips.push({ tone: 'info', title: `Proteína: ${c.prot} g al día`, body: `Son ${OBJ[o].prot} g por kilo para tu objetivo. Repártela en 3 o 4 comidas: 100 g de pollo tienen ~31 g, un scoop de whey ~24 g, un huevo ~6 g.` });
  // Agua y pasos
  const wg = waterGoal(), sg = stepsGoal();
  const wDays = last7.filter(d => day(d.date).water > 0);
  const sDays = last7.filter(d => day(d.date).steps > 0);
  if (wDays.length) {
    const avgW = wDays.reduce((s, d) => s + day(d.date).water, 0) / wDays.length;
    const hit = wDays.filter(d => day(d.date).water >= wg).length;
    tips.push({ tone: avgW >= wg ? 'good' : 'info', title: `Agua: ${kg(Math.round(avgW * 10) / 10)} de ${bottlesText(wg)} al día`, body: `Llegaste a tu meta de agua ${hit} de ${wDays.length} días registrados. En días de entrenamiento suma media Owala más por cada hora.` });
  } else {
    tips.push({ tone: 'info', title: `Agua: ${bottlesText(wg)} de 32 oz al día`, body: `Son ${fmt(wg * OWALA_ML)} ml. Registra cada botella en Hoy para seguir tu avance.` });
  }
  if (sDays.length) {
    const avgS = sDays.reduce((s, d) => s + day(d.date).steps, 0) / sDays.length;
    const hitS = sDays.filter(d => day(d.date).steps >= sg).length;
    tips.push({ tone: avgS >= sg ? 'good' : 'act', title: `${fmt(avgS)} pasos al día en promedio`, body: `Llegaste a ${fmt(sg)} pasos ${hitS} de ${sDays.length} días.` + (avgS < sg ? ` Te faltan unos ${fmt(sg - avgS)} al día; 10 minutos de caminata son cerca de 1,000 pasos.` : '') });
  }
  return tips;
}

function renderAnalisis() {
  const p = S.profile, c = calc(p);
  if (!c) {
    return `
      <header class="topbar"><div class="title"><h1>Análisis</h1><p class="muted small">Tu avance hacia tu meta</p></div></header>
      <section class="card"><h2>Pon tu meta primero</h2>
        <p class="muted">Necesito tu peso meta y la fecha para calcular tu plan y analizar tu avance.</p>
        <button class="btn" data-action="go" data-tab="perfil">Poner mi meta</button></section>`;
  }
  const g = progressInfo(p, c);
  const recent = sortedWeights().slice(-5).reverse();
  return `
    <header class="topbar"><div class="title"><h1>Análisis</h1>
      <p class="muted small">${esc(OBJ[p.objetivo].label)} · ${kg(p.pesoMeta)} kg para el ${esc(fullDate(p.fechaMeta))}</p></div></header>
    <section class="card">
      <h2>Tu avance</h2>
      <div class="scale">
        <div><span class="eyebrow">Inicio</span><b>${kg(g.start)}</b></div>
        <div class="now"><span class="eyebrow">Ahora</span><b>${kg(g.cur)}</b></div>
        <div><span class="eyebrow">Meta</span><b>${kg(g.goal)}</b></div>
      </div>
      <div class="bar goal" role="img" aria-label="${Math.round(g.pct)}% del camino"><span style="width:${g.pct}%"></span></div>
      ${g.reached ? '<p class="pill good">Llegaste a tu meta</p>' : `
      <p>Te faltan <b>${kg(Math.abs(g.remaining))} kg</b> ${c.days > 0 ? `en ${c.days} días. Ritmo necesario: <b>${signed(c.weekly, kg)} kg por semana</b> (${signed(c.dailyAdj)} kcal al día sobre tu gasto).` : '. Tu fecha meta ya pasó; elige una nueva en Perfil para recalcular el ritmo.'}</p>
      ${g.rate !== null ? `<p class="muted small">Tu ritmo real según tus pesajes: ${signed(g.rate, kg)} kg por semana${g.eta ? `. A ese ritmo llegas el ${esc(fullDate(g.eta))}.` : '.'}</p>` : '<p class="muted small">Registra tu peso al menos una vez por semana y te digo tu ritmo real y la fecha estimada de llegada.</p>'}`}
      <form id="weight-form" class="inline" autocomplete="off">
        <label for="w-kg">Peso de hoy (kg)<input id="w-kg" type="number" inputmode="decimal" step="0.1" min="30" max="300" placeholder="${kg(g.cur)}" required></label>
        <button class="btn" type="submit">Registrar</button>
      </form>
      ${recent.length ? `<div class="group">${recent.map(w => `
        <div class="item"><span class="name">${esc(fullDate(w.date))}</span><span class="kcal">${kg(w.kg)} kg</span>
        <button class="del" data-action="del-weight" data-id="${w.id}" aria-label="Borrar pesaje">×</button></div>`).join('')}</div>` : ''}
    </section>
    <h2 class="section-label">Últimos 7 días</h2>
    ${buildAnalysis(p, c).map(t => `<article class="tip ${t.tone}"><h3>${esc(t.title)}</h3><p class="muted">${esc(t.body)}</p></article>`).join('')}
    <p class="muted small">Los cálculos son estimaciones: gasto con la fórmula Mifflin-St Jeor y 1 kg ≈ 7,700 kcal.</p>`;
}

/* ---------- PERFIL ---------- */
function renderPerfil() {
  const p = S.profile || { objetivo: 'grasa', sexo: 'm', edad: '', altura: '', factor: 1.2 };
  const c = calc(S.profile);
  const peso = S.profile ? currentWeight() : '';
  const fechaMeta = p.fechaMeta || addDays(today(), 84);
  const factors = [[1.2, 'Sedentario (oficina, casa)'], [1.375, 'Ligero (camino algo al día)'], [1.55, 'Activo (trabajo de pie o en movimiento)'], [1.725, 'Muy activo (trabajo físico pesado)']];
  return `
    <header class="topbar"><div class="title"><h1>Perfil</h1><p class="muted small">Tus datos se quedan solo en este iPhone</p></div></header>
    ${c ? `
    <section class="card">
      <h2>Tu plan</h2>
      <p>De <b>${kg(c.peso)} kg</b> a <b>${kg(p.pesoMeta)} kg</b> ${c.days > 0 ? `en ${Math.round(c.days / 7 * 10) / 10} semanas` : ''}.</p>
      <div class="kpis">
        <div class="kpi"><span class="eyebrow">Meta diaria</span><b>${fmt(c.target)}</b><span class="muted small">kcal ${c.manual ? '(tuya)' : ''}</span></div>
        <div class="kpi"><span class="eyebrow">Ritmo</span><b>${signed(c.weekly, kg)} kg</b><span class="muted small">por semana</span></div>
        <div class="kpi"><span class="eyebrow">Gasto diario</span><b>${fmt(c.tdee)}</b><span class="muted small">kcal sin ejercicio</span></div>
        <div class="kpi"><span class="eyebrow">Proteína</span><b>${c.prot} g</b><span class="muted small">al día</span></div>
      </div>
      ${c.manual ? `<p class="muted small">El cálculo automático para tu meta da ${fmt(c.auto)} kcal; estás usando tu propia cifra.</p>` : ''}
      <p class="muted small">El ejercicio que registres se suma a tu meta de ese día.</p>
    </section>` : `
    <section class="card"><h2>Bienvenida a Bits</h2>
      <p class="muted">Cuéntame qué quieres lograr, a qué peso quieres llegar y para cuándo. Con eso calculo tus calorías diarias.</p></section>`}
    <section class="card">
      <h2>Mi meta</h2>
      <form id="profile-form">
        <div class="eyebrow">Qué quiero lograr</div>
        <div class="chips" role="radiogroup" aria-label="Objetivo">
          ${Object.entries(OBJ).map(([k, o]) => `<button type="button" role="radio" aria-checked="${p.objetivo === k}" data-action="obj" data-obj="${k}">${o.label}</button>`).join('')}
        </div>
        <input type="hidden" id="p-obj" value="${p.objetivo}">
        <div class="row">
          <label for="p-peso">Peso actual (kg)<input id="p-peso" type="number" inputmode="decimal" step="0.1" min="30" max="300" value="${peso}" required></label>
          <label for="p-meta">Peso meta (kg)<input id="p-meta" type="number" inputmode="decimal" step="0.1" min="30" max="300" value="${p.pesoMeta || ''}" required></label>
        </div>
        <label for="p-fecha">Para cuándo<input id="p-fecha" type="date" min="${addDays(today(), 1)}" value="${fechaMeta}" required></label>
        <div class="row">
          <label for="p-sexo">Sexo (para la fórmula)<select id="p-sexo"><option value="m" ${p.sexo === 'm' ? 'selected' : ''}>Mujer</option><option value="h" ${p.sexo === 'h' ? 'selected' : ''}>Hombre</option></select></label>
          <label for="p-edad">Edad<input id="p-edad" type="number" inputmode="numeric" min="14" max="100" value="${p.edad}" required></label>
        </div>
        <div class="row">
          <label for="p-altura">Altura (cm)<input id="p-altura" type="number" inputmode="numeric" min="120" max="230" value="${p.altura}" required></label>
          <label for="p-kcal">Mis calorías <span class="hint">(opcional)</span><input id="p-kcal" type="number" inputmode="numeric" min="0" max="9000" value="${p.kcalManual || ''}" placeholder="${c ? 'Auto: ' + fmt(c.auto) : 'Automático'}"></label>
        </div>
        <div class="row">
          <label for="p-agua">Meta de agua (Owalas 32 oz)<input id="p-agua" type="number" inputmode="decimal" step="0.5" min="0" max="10" value="${p.aguaMeta || ''}" placeholder="Auto: ${kg(waterGoal())}"></label>
          <label for="p-pasos">Meta de pasos<input id="p-pasos" type="number" inputmode="numeric" step="500" min="0" max="50000" value="${p.pasosMeta || ''}" placeholder="10,000"></label>
        </div>
        <label for="p-factor">Actividad en tu día a día, sin contar entrenamiento
          <select id="p-factor">${factors.map(([v, l]) => `<option value="${v}" ${+p.factor === v ? 'selected' : ''}>${l}</option>`).join('')}</select></label>
        <button class="btn" type="submit">${c ? 'Actualizar mi plan' : 'Calcular mi plan'}</button>
      </form>
    </section>
    <section class="card">
      <h2>Respaldo</h2>
      <p class="muted small">Guarda una copia de tus registros por si cambias de teléfono. ${S.entries.length} comidas, ${S.acts.length} entrenamientos, ${S.weights.length} pesajes y ${Object.keys(S.daily).length} días de agua y pasos guardados.</p>
      <div class="btnrow">
        <button class="btn ghost" data-action="export">Exportar copia</button>
        <button class="btn ghost" data-action="import">Importar copia</button>
        <input type="file" id="import-file" accept="application/json,.json" hidden>
      </div>
      ${state.confirmWipe ? `
        <p class="pill warn">Se borrarán todos tus registros y tu perfil. No se puede deshacer.</p>
        <div class="btnrow"><button class="btn danger" data-action="wipe-yes">Sí, borrar todo</button><button class="btn ghost" data-action="wipe-no">Cancelar</button></div>`
      : `<button class="btn ghost" data-action="wipe" style="color:var(--warn)">Borrar todos mis datos</button>`}
    </section>`;
}

/* ---------- Render y eventos ---------- */
function render() {
  const views = { hoy: renderHoy, semana: renderSemana, analisis: renderAnalisis, perfil: renderPerfil };
  $('#view').innerHTML = views[state.tab]();
  document.querySelectorAll('nav.tabs button').forEach(b => {
    if (b.dataset.tab === state.tab) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  if (state.tab === 'hoy') updateActKcal();
}

function updateActKcal() {
  const k = $('#act-kcal');
  if (!k || k.dataset.manual) return;
  const min = +$('#act-min').value || 0;
  k.value = min ? actKcal($('#act-type').value, min, state.intens) : '';
}

function go(tab) { state.tab = tab; state.confirmWipe = false; render(); window.scrollTo(0, 0); }

function pick(attr, value, btn) {
  document.querySelectorAll(`[data-action="${attr}"]`).forEach(x => x.setAttribute('aria-checked', x === btn));
}

document.addEventListener('click', e => {
  const tabBtn = e.target.closest('nav.tabs button');
  if (tabBtn) return go(tabBtn.dataset.tab);
  const b = e.target.closest('[data-action]');
  if (!b) return;
  const a = b.dataset.action;
  if (a === 'go') go(b.dataset.tab);
  else if (a === 'day') { const n = addDays(state.date, +b.dataset.n); if (n <= today()) { state.date = n; render(); } }
  else if (a === 'week') { state.week = Math.min(0, state.week + +b.dataset.n); render(); }
  else if (a === 'open-day') { state.date = b.dataset.date > today() ? today() : b.dataset.date; go('hoy'); }
  else if (a === 'meal') {
    state.meal = b.dataset.meal; pick('meal', state.meal, b);
    $('#food-form .btn').textContent = 'Agregar a ' + MEALS.find(m => m[0] === state.meal)[1].toLowerCase();
  }
  else if (a === 'intens') { state.intens = b.dataset.intens; pick('intens', state.intens, b); delete $('#act-kcal').dataset.manual; updateActKcal(); }
  else if (a === 'obj') { $('#p-obj').value = b.dataset.obj; pick('obj', b.dataset.obj, b); }
  else if (a === 'water') {
    const w = Math.max(0, day(state.date).water + +b.dataset.n);
    setDay(state.date, { water: w }); save(); render();
    if (w >= waterGoal() && +b.dataset.n > 0 && w - +b.dataset.n < waterGoal()) toast('Llegaste a tu meta de agua');
  }
  else if (a === 'del-food') { S.entries = S.entries.filter(x => x.id !== b.dataset.id); save(); render(); toast('Comida borrada'); }
  else if (a === 'del-act') { S.acts = S.acts.filter(x => x.id !== b.dataset.id); save(); render(); toast('Entrenamiento borrado'); }
  else if (a === 'del-weight') { S.weights = S.weights.filter(x => x.id !== b.dataset.id); save(); render(); toast('Pesaje borrado'); }
  else if (a === 'export') exportData();
  else if (a === 'import') $('#import-file').click();
  else if (a === 'wipe') { state.confirmWipe = true; render(); }
  else if (a === 'wipe-no') { state.confirmWipe = false; render(); }
  else if (a === 'wipe-yes') {
    S.profile = null; S.entries = []; S.acts = []; S.weights = []; S.daily = {}; save();
    state.confirmWipe = false; render(); toast('Se borraron todos tus datos');
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'food-name') {
    const f = FOODS.find(x => x[0] === e.target.value);
    if (f) $('#food-kcal').value = f[1];
  }
  if (e.target.id === 'act-kcal') e.target.dataset.manual = '1';
  if (e.target.id === 'act-min') updateActKcal();
});
document.addEventListener('change', e => {
  if (e.target.id === 'act-type') { delete $('#act-kcal').dataset.manual; updateActKcal(); }
  if (e.target.id === 'import-file' && e.target.files[0]) importData(e.target.files[0]);
});

document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'food-form') {
    const name = $('#food-name').value.trim(), kcal = Math.round(+$('#food-kcal').value);
    if (!name || !(kcal > 0)) return toast('Escribe el alimento y sus calorías');
    S.entries.push({ id: uid(), date: state.date, meal: state.meal, name, kcal });
    save(); render(); toast(`Agregado: ${name}`);
  } else if (f.id === 'act-form') {
    const type = $('#act-type').value, min = Math.round(+$('#act-min').value), kcal = Math.round(+$('#act-kcal').value);
    const detalle = $('#act-detalle').value.trim();
    if (!(min > 0)) return toast('Escribe cuántos minutos');
    S.acts.push({ id: uid(), date: state.date, type, min, intens: state.intens, detalle, kcal: kcal >= 0 ? kcal : actKcal(type, min, state.intens) });
    save(); render(); toast(`Agregado: ${ACTS[type][0]}, ${min} min`);
  } else if (f.id === 'steps-form') {
    const n = Math.round(+$('#st-n').value);
    if (!(n >= 0)) return toast('Escribe tus pasos');
    setDay(state.date, { steps: n }); save(); render(); toast(`${fmt(n)} pasos guardados`);
  } else if (f.id === 'weight-form') {
    const v = Math.round(+$('#w-kg').value * 10) / 10;
    if (!(v > 0)) return toast('Escribe tu peso en kg');
    setWeight(today(), v); save(); render(); toast(`Peso registrado: ${kg(v)} kg`);
  } else if (f.id === 'profile-form') {
    const peso = Math.round(+$('#p-peso').value * 10) / 10;
    const pesoMeta = Math.round(+$('#p-meta').value * 10) / 10;
    const fechaMeta = $('#p-fecha').value;
    if (!fechaMeta || fechaMeta <= today()) return toast('Elige una fecha meta a partir de mañana');
    const prev = S.profile || {};
    const first = !prev.pesoMeta;
    S.profile = {
      objetivo: $('#p-obj').value, sexo: $('#p-sexo').value, edad: +$('#p-edad').value, altura: +$('#p-altura').value,
      factor: +$('#p-factor').value, peso, pesoMeta, fechaMeta, kcalManual: Math.round(+$('#p-kcal').value) || 0,
      aguaMeta: +$('#p-agua').value || 0, pasosMeta: Math.round(+$('#p-pasos').value) || 0,
      // El punto de partida se reinicia cuando cambias de peso meta
      pesoInicio: prev.pesoInicio && prev.pesoMeta === pesoMeta ? prev.pesoInicio : peso
    };
    if (!S.weights.length || currentWeight() !== peso) setWeight(today(), peso);
    save();
    const c = calc(S.profile);
    if (first) { toast(`Tu meta: ${fmt(c.target)} kcal al día`); go('hoy'); }
    else { render(); toast('Plan actualizado'); }
  }
});

async function exportData() {
  const name = `bits-${today()}.json`;
  const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
  try {
    const file = new File([blob], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Respaldo de Bits' });
      return;
    }
  } catch (err) { if (err.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function importData(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = migrate(JSON.parse(r.result));
      if (!Array.isArray(d.entries) || !Array.isArray(d.acts)) throw new Error();
      S.profile = d.profile || null; S.entries = d.entries; S.acts = d.acts; S.weights = d.weights; S.daily = d.daily;
      save(); render(); toast(`Importados ${d.entries.length} registros de comida`);
    } catch (e) { toast('Ese archivo no es un respaldo de Bits'); }
  };
  r.readAsText(file);
}

$('#foods').innerHTML = FOODS.map(([n, k]) => `<option value="${esc(n)}">${k} kcal</option>`).join('');
$('#groups').innerHTML = GROUPS.map(g => `<option value="${g}"></option>`).join('');
render();

// Pedir que iOS no borre los datos y activar uso sin internet
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
